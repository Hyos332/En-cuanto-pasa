name: CI/CD Pipeline

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    strategy:
      matrix:
        node-version: [20]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
    
    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit
    
    - name: Run linter
      run: npm run lint
    
    - name: Run tests
      run: npm test
    
    - name: Build application
      run: npm run build

  deploy:
    needs: [test]
    if: github.ref == 'refs/heads/master'
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
    - name: Deploy Application
      env:
        PORT: 3005
        SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
        KRONOS_CREDENTIALS_SECRET: ${{ secrets.KRONOS_CREDENTIALS_SECRET }}
        PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        TUS_REQUEST_TIMEOUT_MS: ${{ vars.TUS_REQUEST_TIMEOUT_MS }}
        KRONOS_MAX_CONCURRENCY: ${{ vars.KRONOS_MAX_CONCURRENCY }}
        KRONOS_NAVIGATION_TIMEOUT_MS: ${{ vars.KRONOS_NAVIGATION_TIMEOUT_MS }}
        SEMANAL_ALLOWED_USERNAMES: ${{ vars.SEMANAL_ALLOWED_USERNAMES }}
        SEMANAL_ALLOWED_USER_IDS: ${{ vars.SEMANAL_ALLOWED_USER_IDS }}
        SEMANAL_WEEKLY_TARGETS: ${{ vars.SEMANAL_WEEKLY_TARGETS }}
        SEMANAL_GSHEETS_ENABLED: ${{ vars.SEMANAL_GSHEETS_ENABLED }}
        SEMANAL_GSHEETS_SPREADSHEET_ID: ${{ secrets.SEMANAL_GSHEETS_SPREADSHEET_ID }}
        SEMANAL_GSHEETS_SHEET_NAME: ${{ vars.SEMANAL_GSHEETS_SHEET_NAME }}
        SEMANAL_GSHEETS_CREDENTIALS_BASE64: ${{ secrets.SEMANAL_GSHEETS_CREDENTIALS_BASE64 }}
      run: |
        PROJECT_DIR=/srv/projects/En-cuanto-pasa
        git config --global --add safe.directory "$PROJECT_DIR"
        cd "$PROJECT_DIR"
        if [ ! -w "$PROJECT_DIR/.git" ]; then
          echo "::error::El runner no puede escribir en $PROJECT_DIR/.git. En el servidor ejecuta: sudo chown -R \$(id -u):\$(id -g) $PROJECT_DIR"
          ls -ld "$PROJECT_DIR" "$PROJECT_DIR/.git"
          exit 1
        fi
        if [ -z "${SLACK_BOT_TOKEN}" ]; then
          echo "::error::Falta el secret SLACK_BOT_TOKEN en GitHub Actions."
          exit 1
        fi
        if [ -z "${SLACK_SIGNING_SECRET}" ]; then
          echo "::error::Falta el secret SLACK_SIGNING_SECRET en GitHub Actions."
          exit 1
        fi
        if [ -z "${KRONOS_CREDENTIALS_SECRET}" ]; then
          echo "::error::Falta el secret KRONOS_CREDENTIALS_SECRET en GitHub Actions."
          exit 1
        fi

        PUBLIC_BASE_URL="${PUBLIC_BASE_URL:-https://en-cuanto-pasa.ctdesarrollo-sdr.org}"
        TUS_REQUEST_TIMEOUT_MS="${TUS_REQUEST_TIMEOUT_MS:-8000}"
        KRONOS_MAX_CONCURRENCY="${KRONOS_MAX_CONCURRENCY:-1}"
        KRONOS_NAVIGATION_TIMEOUT_MS="${KRONOS_NAVIGATION_TIMEOUT_MS:-45000}"

        if [ -z "${PUBLIC_BASE_URL}" ]; then
          echo "::error::Falta PUBLIC_BASE_URL."
          exit 1
        fi

        git fetch --prune origin master
        git checkout -B master origin/master
        cat > .env <<EOF
        PORT=${PORT}
        SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
        SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET}
        KRONOS_CREDENTIALS_SECRET=${KRONOS_CREDENTIALS_SECRET}
        PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
        TUS_REQUEST_TIMEOUT_MS=${TUS_REQUEST_TIMEOUT_MS}
        KRONOS_MAX_CONCURRENCY=${KRONOS_MAX_CONCURRENCY}
        KRONOS_NAVIGATION_TIMEOUT_MS=${KRONOS_NAVIGATION_TIMEOUT_MS}
        SEMANAL_ALLOWED_USERNAMES=${SEMANAL_ALLOWED_USERNAMES}
        SEMANAL_ALLOWED_USER_IDS=${SEMANAL_ALLOWED_USER_IDS}
        SEMANAL_WEEKLY_TARGETS=${SEMANAL_WEEKLY_TARGETS}
        SEMANAL_GSHEETS_ENABLED=${SEMANAL_GSHEETS_ENABLED}
        SEMANAL_GSHEETS_SPREADSHEET_ID=${SEMANAL_GSHEETS_SPREADSHEET_ID}
        SEMANAL_GSHEETS_SHEET_NAME=${SEMANAL_GSHEETS_SHEET_NAME}
        SEMANAL_GSHEETS_CREDENTIALS_BASE64=${SEMANAL_GSHEETS_CREDENTIALS_BASE64}
        EOF
        docker compose up -d --build --remove-orphans
        docker compose ps
        for attempt in $(seq 1 30); do
          if curl --fail --silent --show-error --max-time 3 "http://127.0.0.1:${PORT}/health"; then
            echo
            echo "Healthcheck OK"
            exit 0
          fi

          echo "Esperando a que el bot responda /health... intento ${attempt}/30"
          docker compose ps
          sleep 2
        done

        echo "::error::El bot no respondio /health despues del despliegue."
        docker compose logs --tail=200 slack-bot
        exit 1
