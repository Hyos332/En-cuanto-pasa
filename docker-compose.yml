services:
  slack-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tus-slack-bot
    init: true
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    volumes:
      - ./data:/app/data
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT:-3000}/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: tus-slack-bot-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
